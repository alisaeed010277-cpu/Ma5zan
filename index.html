<script>
// ============================================================
// IndexedDB wrapper — بيستحمل جيجابايت بدل 5MB
// ملاحظة: اسم قاعدة البيانات ومفاتيح الـ localStorage كلها بادئة "am_" (أمين المخزن)
// عشان لو اتنصب على نفس دومين GitHub Pages بتاع تطبيقات علي التانية، تفضل بياناتهم منفصلة تمامًا ومفيش أي تعارض
// ============================================================
const DB_NAME='ameenMakhzanApp';const DB_VER=1;const STORE='kvStore';
let _idb=null;

function openIDB(){
  return new Promise((res,rej)=>{
    if(_idb){res(_idb);return;}
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{e.target.result.createObjectStore(STORE,{keyPath:'k'});};
    req.onsuccess=e=>{_idb=e.target.result;res(_idb);};
    req.onerror=e=>rej(e);
  });
}
function idbGet(key){
  return openIDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).get(key);
    req.onsuccess=()=>res(req.result?req.result.v:null);
    req.onerror=e=>rej(e);
  }));
}
function idbSet(key,val){
  return openIDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put({k:key,v:val});
    tx.oncomplete=()=>res();
    tx.onerror=e=>rej(e);
  }));
}

// للتفعيل والإعدادات — بيفضل localStorage (بيانات صغيرة جداً)
const DB={
  get:(k)=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

const KEYS={warehouses:'am_warehouses',companyProfile:'am_companyProfile'};

// البيانات الرئيسية: كل مخزن عنده أصنافه وحركاته الخاصة بيه بالكامل (منفصلة تمامًا عن أي مخزن تاني)
let warehouses=[]; // [{id,name,products:[],movements:[]}]
let currentWarehouseId=null;
let companyProfile={name:'',phone:''};

function currentWarehouse(){
  return warehouses.find(w=>w.id===currentWarehouseId) || warehouses[0] || null;
}

// بتضيف اسم الشركة (لو متسجل) لاسم ملف الباك أب، عشان تقدر تميّز بين نسخ احتياطية من أكثر من نسخة تطبيق على نفس الجهاز
function backupFileLabel(){
  const name=(companyProfile.name||'').trim();
  if(!name) return '';
  const clean=name.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_');
  return clean?('_'+clean):'';
}

// دالة عامة: تحدّث متغير بحث وتعيد الرسم، مع الحفاظ على التركيز ومكان المؤشر بالكيبورد
function searchInputHandler(el, setter, renderFn){
  setter(el.value);
  const pos=el.selectionStart;
  const id=el.id;
  renderFn();
  const ne=document.getElementById(id);
  if(ne){ ne.focus(); try{ ne.setSelectionRange(pos,pos); }catch(e){} }
}

// ====== مكوّن قائمة بحث قابلة لإعادة الاستخدام (searchable select) ======
let _sselData={};
function searchableSelectHtml(fieldId, options, placeholder, selectedId, onPickExtra){
  _sselData[fieldId]={options, onPickExtra: onPickExtra||''};
  const sel=options.find(o=>o.id===selectedId);
  return `<div class="ssel-wrap">
    <input type="text" class="ssel-input" id="${fieldId}_search" placeholder="${placeholder}" autocomplete="off"
      value="${sel?sel.label.replace(/"/g,'&quot;'):''}"
      oninput="_sselFilter('${fieldId}')" onfocus="_sselFilter('${fieldId}')"
      onblur="setTimeout(()=>{const l=document.getElementById('${fieldId}_list');if(l)l.style.display='none';},200)">
    <input type="hidden" id="${fieldId}" value="${selectedId||''}">
    <div class="ssel-list" id="${fieldId}_list"></div>
  </div>`;
}
function _sselFilter(fieldId){
  const data=_sselData[fieldId];
  if(!data)return;
  const q=(document.getElementById(fieldId+'_search')?.value||'').trim();
  const list=document.getElementById(fieldId+'_list');
  if(!list)return;
  const matches=q?data.options.filter(o=>o.label.includes(q)):data.options;
  if(matches.length===0){
    list.innerHTML=`<div class="ssel-empty">لا توجد نتائج</div>`;
  }else{
    list.innerHTML=matches.slice(0,100).map(o=>`<div class="ssel-item" onmousedown="_sselPick('${fieldId}','${o.id}')"><div>${o.label}</div>${o.sub?`<div class="sub">${o.sub}</div>`:''}</div>`).join('');
  }
  list.style.display='block';
}
function _sselPick(fieldId, optId){
  const data=_sselData[fieldId];
  if(!data)return;
  const opt=data.options.find(o=>o.id===optId);
  if(!opt)return;
  const hidden=document.getElementById(fieldId);
  const search=document.getElementById(fieldId+'_search');
  const list=document.getElementById(fieldId+'_list');
  if(hidden)hidden.value=opt.id;
  if(search)search.value=opt.label;
  if(list)list.style.display='none';
  if(data.onPickExtra)(new Function(data.onPickExtra))();
}

// حفظ async في IndexedDB
const save=()=>{
  idbSet(KEYS.warehouses,warehouses);
  idbSet(KEYS.companyProfile,companyProfile);
  DB.set('am_currentWarehouseId', currentWarehouseId);
};

async function loadAllData(){
  const [w,comp]=await Promise.all([idbGet(KEYS.warehouses), idbGet(KEYS.companyProfile)]);
  warehouses = Array.isArray(w) && w.length>0 ? w : [];
  companyProfile = comp || {name:'',phone:''};
  if(warehouses.length===0){
    // أول تشغيل: نجهز مخزن افتراضي واحد
    warehouses=[{id:uid(),name:'المخزن الرئيسي',products:[],movements:[]}];
  }
  const savedCurrent=DB.get('am_currentWarehouseId');
  currentWarehouseId = savedCurrent && warehouses.some(x=>x.id===savedCurrent) ? savedCurrent : warehouses[0].id;
  save();
}

let _id=Date.now();
const uid=()=>(++_id).toString(36);
const today=()=>new Date().toISOString().slice(0,10);

const stockQty=(pid)=>{
  const wh=currentWarehouse();
  if(!wh) return 0;
  return wh.movements.filter(m=>m.productId===pid).reduce((s,m)=>m.type==='in'?s+m.qty:s-m.qty,0);
};
const stockQtyFor=(wh,pid)=>wh.movements.filter(m=>m.productId===pid).reduce((s,m)=>m.type==='in'?s+m.qty:s-m.qty,0);
// بيجيب الكميات مقسمة على تواريخ الصلاحية
const stockBatches=(pid)=>{
  const wh=currentWarehouse();
  if(!wh) return [];
  const batches={};
  wh.movements.filter(m=>m.productId===pid).forEach(m=>{
    const key=m.expiry||'—';
    if(!batches[key]) batches[key]=0;
    batches[key]+=m.type==='in'?m.qty:-m.qty;
  });
  return Object.entries(batches).filter(([k,v])=>v>0).sort((a,b)=>a[0].localeCompare(b[0]));
};

}

function _handleLogoUpload(input){
  const file=input.files && input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const maxSize=150;
      let w=img.width, h=img.height;
      if(w>h){ if(w>maxSize){h=Math.round(h*maxSize/w); w=maxSize;} }
      else{ if(h>maxSize){w=Math.round(w*maxSize/h); h=maxSize;} }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      _tempLogoDataUrl=canvas.toDataURL('image/jpeg',0.85);
      const prev=document.getElementById('logoPreview');
      if(prev){ prev.src=_tempLogoDataUrl; prev.style.display='inline-block'; }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// يحوّل محتوى المستند لصورة JPEG عالية الجودة عن طريق رسمه في SVG foreignObject ثم Canvas
async function renderDocToJpeg(title, bodyHtml){
  const logoSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 70 70"><defs><linearGradient id="pg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FFD700"/><stop offset="100%" style="stop-color:#F39C12"/></linearGradient></defs><circle cx="35" cy="35" r="35" fill="url(#pg2)"/><text x="35" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#1A5276" letter-spacing="1">أم</text></svg>`;
  const holder=document.createElement('div');
  holder.style.cssText=`position:fixed;left:-9999px;top:0;z-index:-1;width:${A4_WIDTH_PX}px;`;
  holder.innerHTML=`<style>${DOC_STYLE}</style><div class="doc-wrap" id="_pdfDocRoot">${buildDocInnerHtml(title, bodyHtml, logoSvg)}</div>`;
  document.body.appendChild(holder);
  await new Promise(r=>setTimeout(r,60));
  const rootEl=holder.querySelector('#_pdfDocRoot');
  const w=rootEl.offsetWidth||A4_WIDTH_PX;
  const contentH=rootEl.offsetHeight||400;
  const h=Math.max(contentH, A4_HEIGHT_PX);
  const serializer=new XMLSerializer();
  const styleStr=serializer.serializeToString(holder.querySelector('style'));
  const rootStr=serializer.serializeToString(rootEl);
  document.body.removeChild(holder);

  const svgStr=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${contentH}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">${styleStr}${rootStr}</div></foreignObject></svg>`;
  const svgDataUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);

  const img=new Image();
  const loaded=new Promise((resolve,reject)=>{ img.onload=()=>resolve(); img.onerror=()=>reject(new Error('تعذر تجهيز صورة المستند')); });
  img.src=svgDataUrl;
  await loaded;

  const scale=2;
  const canvas=document.createElement('canvas');
  canvas.width=w*scale; canvas.height=h*scale;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,w*scale,contentH*scale);

  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.92));
  return {blob, cssWidth:w, cssHeight:h, pxWidth:canvas.width, pxHeight:canvas.height};
}

// بناء ملف PDF يدويًا (بدون أي مكتبة) بتضمين صورة المستند كصفحة واحدة
function buildPdfFromJpeg(jpegBytes, pxWidth, pxHeight, ptWidth, ptHeight){
  const encoder=new TextEncoder();
  const parts=[]; let offset=0; const offsets=[];
  function push(chunk){
    const bytes=(typeof chunk==='string')?encoder.encode(chunk):chunk;
    parts.push(bytes); offset+=bytes.length;
  }
  push('%PDF-1.4\n');
  offsets[1]=offset; push(`1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`);
  offsets[2]=offset; push(`2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n`);
  offsets[3]=offset; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /MediaBox [0 0 ${ptWidth.toFixed(2)} ${ptHeight.toFixed(2)}] /Contents 5 0 R >>\nendobj\n`);
  offsets[4]=offset; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pxWidth} /Height ${pxHeight} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
  push(jpegBytes);
  push(`\nendstream\nendobj\n`);
  const contentStr=`q ${ptWidth.toFixed(2)} 0 0 ${ptHeight.toFixed(2)} 0 0 cm /Im0 Do Q`;
  offsets[5]=offset; push(`5 0 obj\n<< /Length ${contentStr.length} >>\nstream\n${contentStr}\nendstream\nendobj\n`);
  const xrefStart=offset;
  push(`xref\n0 6\n0000000000 65535 f \n`);
  for(let i=1;i<=5;i++){ push(String(offsets[i]).padStart(10,'0')+' 00000 n \n'); }
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
  const total=parts.reduce((s,p)=>s+p.length,0);
  const out=new Uint8Array(total);
  let pos=0; for(const p of parts){ out.set(p,pos); pos+=p.length; }
  return new Blob([out],{type:'application/pdf'});
}

async function generateDocumentPdfBlob(title, bodyHtml){
  const {blob, cssWidth, cssHeight, pxWidth, pxHeight}=await renderDocToJpeg(title, bodyHtml);
  const jpegBytes=new Uint8Array(await blob.arrayBuffer());
  const ptWidth=cssWidth*0.75, ptHeight=cssHeight*0.75;
  const pdfBlob=buildPdfFromJpeg(jpegBytes, pxWidth, pxHeight, ptWidth, ptHeight);
  return {pdfBlob, jpegBlob:blob};
}

// نافذة معاينة المستند قبل الإرسال — بترجع Promise تتحل لما المستخدم يقفل النافذة (سواء بعت أو رجع)
function showPdfPreviewModal(jpegBlob, onConfirm, onPrint){
  return new Promise((resolve)=>{
    const url=URL.createObjectURL(jpegBlob);
    const modal=document.createElement('div');
    modal.id='pdfPreviewModal';
    modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;';
    modal.innerHTML=`
      <div style="background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)">
        <div style="padding:12px 16px;border-bottom:1px solid #D5D8DC;font-weight:bold;color:#1A5276;text-align:center">👁️ معاينة قبل الإرسال</div>
        <div style="overflow:auto;flex:1;background:#F2F3F4;padding:10px;display:flex;justify-content:center">
          <img src="${url}" style="width:100%;max-width:380px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15)">
        </div>
        <div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid #D5D8DC">
          <button id="pdfPreviewBack" style="flex:1;background:#EAECEE;color:#333;border:none;border-radius:8px;padding:12px 6px;font-size:13px;cursor:pointer">→ رجوع</button>
          ${onPrint?`<button id="pdfPreviewPrint" style="flex:1;background:#D6EAF8;color:#1A5276;border:none;border-radius:8px;padding:12px 6px;font-size:13px;font-weight:bold;cursor:pointer">🖨️ طباعة</button>`:''}
          <button id="pdfPreviewSend" style="flex:1;background:#1A5276;color:#fff;border:none;border-radius:8px;padding:12px 6px;font-size:13px;font-weight:bold;cursor:pointer">📤 إرسال</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    function cleanup(){ URL.revokeObjectURL(url); modal.remove(); }
    modal.querySelector('#pdfPreviewBack').onclick=()=>{ cleanup(); resolve(false); };
    if(onPrint){
      modal.querySelector('#pdfPreviewPrint').onclick=()=>{ try{ onPrint(); }catch(err){ console.error(err); } };
    }
    modal.querySelector('#pdfPreviewSend').onclick=async ()=>{
      const btn=modal.querySelector('#pdfPreviewSend');
      btn.disabled=true; btn.innerHTML='⏳ جاري الإرسال...';
      try{ await onConfirm(); }
      catch(err){ if(!(err && err.name==='AbortError')) console.error(err); }
      cleanup(); resolve(true);
    };
  });
}

// أسماء ملفات الـ PDF بحروف لاتينية آمنة عشان مايبانش رموز غريبة على أي جهاز
const ARABIC_TO_LATIN_MAP={
  'ا':'a','أ':'a','إ':'e','آ':'aa','ب':'b','ت':'t','ث':'th','ج':'g','ح':'h','خ':'kh',
  'د':'d','ذ':'z','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z',
  'ع':'a','غ':'gh','ف':'f','ق':'k','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w',
  'ي':'y','ى':'a','ة':'a','ء':'','ئ':'e','ؤ':'o','ٱ':'a',
  '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'
};
function safeFileName(str){
  if(!str) return 'file';
  let out='';
  for(const ch of String(str)){
    if(ARABIC_TO_LATIN_MAP[ch]!==undefined) out+=ARABIC_TO_LATIN_MAP[ch];
    else if(/[A-Za-z0-9._-]/.test(ch)) out+=ch;
    else if(/\s/.test(ch)) out+=' ';
  }
  out=out.replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^[-.]+|[-.]+$/g,'');
  return out||'file';
}

async function sendDocument(title, bodyHtml, filename){
  const safeFilename=safeFileName(filename);
  try{
    const {pdfBlob, jpegBlob}=await generateDocumentPdfBlob(title, bodyHtml);
    await showPdfPreviewModal(jpegBlob, async ()=>{
      const file=new File([pdfBlob], safeFilename, {type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title});
        return;
      }
      const url=URL.createObjectURL(pdfBlob);
      const a=document.createElement('a');
      a.href=url; a.download=safeFilename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }, ()=>printDocument(title, bodyHtml));
  }catch(err){
    if(err && err.name==='AbortError') return;
    console.error(err);
    printDocument(title, bodyHtml);
  }
}

function editProduct(id){
  editProductId=id;
  showProductForm=true;
  renderStock();
}
function saveProduct(){
  const name=document.getElementById('p_name')?.value.trim();
  const unit=document.getElementById('p_unit')?.value||'وحدة';
  const manufacturer=document.getElementById('p_manufacturer')?.value.trim()||'';
  const activeIngredient=document.getElementById('p_active')?.value.trim()||'';
  if(!name){alert('أدخل اسم المنتج');return;}
  const wh=currentWarehouse();
  if(editProductId){
    const p=wh.products.find(p=>p.id===editProductId);
    if(!p){editProductId=null;showProductForm=false;renderStock();return;}
    p.name=name; p.unit=unit;
    if(manufacturer)p.manufacturer=manufacturer; else delete p.manufacturer;
    if(activeIngredient)p.activeIngredient=activeIngredient; else delete p.activeIngredient;
    save();
    editProductId=null; showProductForm=false;
    renderStock();
    return;
  }
  const openingQty=Number(document.getElementById('p_opening_qty')?.value||0);
  const openingDate=document.getElementById('p_opening_date')?.value||today();
  const openingExpiry=document.getElementById('p_opening_expiry')?.value||'';
  const newProduct={id:uid(),name,unit};
  if(manufacturer)newProduct.manufacturer=manufacturer;
  if(activeIngredient)newProduct.activeIngredient=activeIngredient;
  wh.products.push(newProduct);
  if(openingQty>0){
    wh.movements.push({id:uid(),productId:newProduct.id,type:'in',qty:openingQty,date:openingDate,note:'رصيد افتتاحي',expiry:openingExpiry,party:null,permitNo:'',createdAt:new Date().toISOString()});
  }
  save();showProductForm=false;renderStock();
}
function deleteProduct(id){
  if(!confirm('هتحذف المنتج ده وكل حركاته المسجّلة في المخزن ده؟'))return;
  const wh=currentWarehouse();
  wh.products=wh.products.filter(p=>p.id!==id);
  wh.movements=wh.movements.filter(m=>m.productId!==id);
  save();renderStock();
}

// بيتحقق من الكمية المتاحة لصنف معين في مخزن معين (مش بالضرورة المخزن الحالي) — بيتستخدم عشان نتأكد قبل عملية نقل بين مخزنين
function saveMovement(){
  const productId=document.getElementById('mov_product')?.value;
  const qty=Number(document.getElementById('mov_qty')?.value||0);
  const date=document.getElementById('mov_date')?.value||today();
  const note=document.getElementById('mov_note')?.value||'';
  const expiry=currentMovType==='in'?(document.getElementById('mov_expiry')?.value||''):'';
  const permitNo=document.getElementById('mov_permit')?.value.trim()||'';
  if(!productId||!qty){alert('اختر منتج وأدخل الكمية');return;}
  const wh=currentWarehouse();
  if(currentMovType==='out'&&stockQty(productId)<qty){alert('الكمية المتاحة '+stockQty(productId)+' فقط');return;}

  let party=null;
  if(movPartyMode==='warehouse'){
    const whId=document.getElementById('mov_party_wh')?.value;
    if(!whId){alert('اختر المخزن التاني');return;}
    const destWh=warehouses.find(w=>w.id===whId);
    if(!destWh){alert('تعذر إيجاد المخزن المحدد');return;}
    // لو النوع "وارد" (يعني جاي من المخزن ده)، لازم نتأكد إن المخزن ده عنده كمية كافية من نفس الصنف قبل ما نأكد النقل
    if(currentMovType==='in'){
      const srcProduct=wh.products.find(p=>p.id===productId);
      const destProduct=destWh.products.find(p=>p.name.trim()===srcProduct.name.trim());
      const destQty=destProduct?stockQtyFor(destWh,destProduct.id):0;
      if(!destProduct||destQty<qty){
        alert('الكمية المتاحة من "'+srcProduct.name+'" في مخزن "'+destWh.name+'" مش كفاية (المتاح: '+destQty+')');
        return;
      }
    }
    party={mode:'warehouse',warehouseId:whId};
  }else{
    const txt=document.getElementById('mov_party_text')?.value.trim()||'';
    if(txt) party={mode:'text',text:txt};
  }

  const mov={id:uid(),productId,type:currentMovType,qty,date,note,expiry,party,permitNo,createdAt:new Date().toISOString()};
  wh.movements.push(mov);
  if(party && party.mode==='warehouse') createLinkedTransfer(wh, mov);
  save();showMovForm=false;movPartyMode='text';renderStock();
}

// بيسجل تلقائيًا الحركة المقابلة في المخزن التاني (نقل حقيقي ومربوط بين مخزنين) — بيدور على نفس الصنف بالاسم، ولو مش موجود بينشئه
function createLinkedTransfer(sourceWh, mov){
  const destWh=warehouses.find(w=>w.id===mov.party.warehouseId);
  if(!destWh) return;
  const srcProduct=sourceWh.products.find(p=>p.id===mov.productId);
  if(!srcProduct) return;
  let destProduct=destWh.products.find(p=>p.name.trim()===srcProduct.name.trim());
  if(!destProduct){
    destProduct={id:uid(),name:srcProduct.name,unit:srcProduct.unit};
    if(srcProduct.manufacturer) destProduct.manufacturer=srcProduct.manufacturer;
    if(srcProduct.activeIngredient) destProduct.activeIngredient=srcProduct.activeIngredient;
    destWh.products.push(destProduct);
  }
  const linkedType = mov.type==='out' ? 'in' : 'out';
  const linkedMov={
    id:uid(), productId:destProduct.id, type:linkedType, qty:mov.qty, date:mov.date,
    note: mov.type==='out' ? ('تحويل وارد من مخزن: '+sourceWh.name) : ('تحويل صادر إلى مخزن: '+sourceWh.name),
    expiry: linkedType==='in' ? mov.expiry : '',
    party:{mode:'warehouse',warehouseId:sourceWh.id},
    permitNo: mov.permitNo,
    linkedWarehouseId: sourceWh.id,
    linkedMovementId: mov.id,
    createdAt: new Date().toISOString()
  };
  destWh.movements.push(linkedMov);
  mov.linkedWarehouseId=destWh.id;
  mov.linkedMovementId=linkedMov.id;
}

// حذف حركة — لو كانت جزء من عملية نقل بين مخزنين، بيتم حذف الحركة المقابلة في المخزن التاني كمان (عشان الاتنين يفضلوا متطابقين)
function deleteMovement(id){
  const wh=currentWarehouse();
  const mov=wh.movements.find(m=>m.id===id);
  if(!mov) return;
  if(mov.linkedMovementId && mov.linkedWarehouseId){
    if(!confirm('الحركة دي جزء من عملية نقل بين مخزنين — حذفها هيحذف الحركة المقابلة في المخزن التاني كمان. متأكد؟')) return;
    const destWh=warehouses.find(w=>w.id===mov.linkedWarehouseId);
    if(destWh) destWh.movements=destWh.movements.filter(m=>m.id!==mov.linkedMovementId);
  }else{
    if(!confirm('هتحذف الحركة دي؟')) return;
  }
  wh.movements=wh.movements.filter(m=>m.id!==id);
  save();
  if(stockDetailId) renderStockDetail(); else renderStock();
}

function renderStockMovements(){
  const wh=currentWarehouse();
  const sorted=[...wh.movements].sort((a,b)=>((b.date||'')+(b.createdAt||'')).localeCompare((a.date||'')+(a.createdAt||'')));
  const rows=sorted.map(m=>{
    const p=wh.products.find(p=>p.id===m.productId);
    return `<tr><td>${p?.name||'—'}</td><td>${m.date}</td>
      <td><span class="badge ${m.type==='in'?'green':'red'}">${m.type==='in'?'وارد':'صادر'}</span></td>
      <td style="font-weight:bold">${m.qty}</td>
      <td>${m.expiry||'—'}</td>
      <td style="font-size:12px">${partyDisplay(m.party)}</td>
      <td>${m.permitNo||'—'}</td>
      <td>${m.note||'—'}</td>
      <td><button class="btn-sm red" onclick="deleteMovement('${m.id}')">🗑</button></td></tr>`;
  }).join('');
  document.getElementById('stock-content').innerHTML=`
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">

    ${sorted.length===0?'<div class="empty">لا توجد حركات</div>':`<div class="card tbl-wrap"><table><thead><tr><th>المنتج</th><th>التاريخ</th><th>النوع</th><th>الكمية</th><th>الصلاحية</th><th>الجهة</th><th>رقم الإذن</th><th>ملاحظة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`}`;
}

function renderStockDetail(){
  const wh=currentWarehouse();
  const p=wh.products.find(p=>p.id===stockDetailId);
  if(!p){stockDetailId=null;renderStock();return;}
  const moves=wh.movements.filter(m=>m.productId===stockDetailId).sort((a,b)=>((b.date||'')+(b.createdAt||'')).localeCompare((a.date||'')+(a.createdAt||'')));
  const totalIn=moves.filter(m=>m.type==='in').reduce((s,m)=>s+m.qty,0);
  const totalOut=moves.filter(m=>m.type==='out').reduce((s,m)=>s+m.qty,0);
  const rows=moves.map(m=>`<tr>
    <td>${m.date}</td>
    <td><span class="badge ${m.type==='in'?'green':'red'}">${m.type==='in'?'وارد ↓':'صادر ↑'}</span></td>
    <td style="font-weight:bold">${m.qty}</td>
    <td style="font-size:12px">${partyDisplay(m.party)}</td>
    <td>${m.permitNo||'—'}</td>
    <td>${m.note||'—'}</td>
    <td><button class="btn-sm red" onclick="deleteMovement('${m.id}')">🗑</button></td>
  </tr>`).join('');
  document.getElementById('tab-stock').innerHTML=`
    <div class="back-row">
      <button class="btn gray" onclick="stockDetailId=null;renderStock()">← رجوع</button>
      <div class="page-title">حركة مخزن: ${p.name}</div>
    </div>
    <div class="summary">
      <div class="sum-card blue"><div class="sum-num">${stockQty(p.id)}</div><div class="sum-lbl">الرصيد الحالي (${p.unit})</div></div>
      <div class="sum-card green"><div class="sum-num">${totalIn}</div><div class="sum-lbl">إجمالي الوارد</div></div>
      <div class="sum-card red"><div class="sum-num">${totalOut}</div><div class="sum-lbl">إجمالي الصادر</div></div>
    </div>
    <div class="card">
      <div class="card-head">📋 سجل الحركات</div>
      ${moves.length===0?'<div class="empty">لا توجد حركات</div>':`<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الكمية</th><th>الجهة</th><th>رقم الإذن</th><th>ملاحظة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`}

function exportData(){

function buildExportBlob(){
  const data={warehouses, currentWarehouseId, companyProfile, appEdition:'ameen-almakhzan', exportDate:new Date().toISOString()};
  return new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
}
function markExported(){
  DB.set('am_lastExport', new Date().toISOString());
  hideExportReminder();
}
function doExportDevice(){
  const blob=buildExportBlob();
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='نسخة_احتياطية'+backupFileLabel()+'_'+today()+'.json';a.click();
  URL.revokeObjectURL(url);
  markExported();
  document.getElementById('exportModal').style.display='none';
}
async function doExportShare(){
  const blob=buildExportBlob();
  const fileName='نسخة_احتياطية'+backupFileLabel()+'_'+today()+'.json';
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fileName;a.click();
  URL.revokeObjectURL(url);
  markExported();
  document.getElementById('exportModal').style.display='none';
  await new Promise(r=>setTimeout(r,800));
  const file=new File([blob],fileName,{type:'application/json'});
  if(navigator.share){
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'نسخة احتياطية',text:'نسخة احتياطية من أمين المخزن'});
      }else{
        await navigator.share({title:'نسخة احتياطية - '+fileName,text:'تم حفظ الملف على جهازك، ارفعه على جوجل درايف أو جيميل من مدير الملفات.'});
      }
    }catch(e){}
  }else{
    setTimeout(()=>alert('✅ تم حفظ الملف على جهازك.\nافتح تطبيق جوجل درايف أو جيميل وارفع الملف من مجلد التنزيلات (Downloads).'),300);
  }
}
function hideExportReminder(){
  const el=document.getElementById('exportReminder');
  if(el) el.style.display='none';
}
// نسخة احتياطية تلقائية فعلية: بتنزل ملف الباك أب لوحدها في مجلد التنزيلات كل كام يوم من غير ما ينتظر المستخدم يدوس زرار
function checkAutoBackup(){
  const hasData = warehouses.some(w=>w.products.length>0 || w.movements.length>0);
  if(!hasData) return;
  const last = DB.get('am_lastAutoExport');
  const daysSince = last ? (Date.now()-new Date(last).getTime())/(1000*60*60*24) : Infinity;
  if(daysSince < 3) return;
  try{
    const blob = buildExportBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'نسخة_احتياطية_تلقائية'+backupFileLabel()+'_'+today()+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    const now = new Date().toISOString();
    DB.set('am_lastAutoExport', now);
    DB.set('am_lastExport', now);
    hideExportReminder();
  }catch(e){
    console.error('فشل الباك أب التلقائي', e);
  }
}

function checkExportReminder(){
  const last=DB.get('am_lastExport');
  const banner=document.getElementById('exportReminder');
  if(!banner)return;
  if(!last){
    banner.style.display='flex';
    banner.querySelector('.reminder-text').textContent='⚠️ متعملتش نسخة احتياطية لسه — يفضل تصدّر بياناتك بانتظام.';
    return;
  }
  const daysSince=(Date.now()-new Date(last).getTime())/(1000*60*60*24);
  if(daysSince>=7){
    banner.style.display='flex';
    banner.querySelector('.reminder-text').textContent=`⚠️ آخر تصدير كان من ${Math.floor(daysSince)} يوم — يفضل تعمل نسخة احتياطية جديدة.`;
  }else{
    banner.style.display='none';
  }
}
function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!Array.isArray(data.warehouses) || data.warehouses.length===0){alert('الملف مش صح أو مفيهوش بيانات مخازن!');return;}
        if(!confirm('هيتم استبدال كل البيانات الحالية بالنسخة دي. متأكد؟'))return;
        warehouses=data.warehouses.map(w=>({
          id:w.id||uid(),
          name:w.name||'مخزن',
          products:Array.isArray(w.products)?w.products:[],
          movements:Array.isArray(w.movements)?w.movements:[]
        }));
        currentWarehouseId = data.currentWarehouseId && warehouses.some(w=>w.id===data.currentWarehouseId) ? data.currentWarehouseId : warehouses[0].id;
        if(data.companyProfile && typeof data.companyProfile==='object'){companyProfile=data.companyProfile;}
        save();
        alert('✅ تم استيراد البيانات بنجاح!');
        renderCompanyBar(); renderWarehouseBar(); renderTabsBar(); render();
      }catch(err){alert('حصل خطأ في قراءة الملف!');}
    };
    reader.readAsText(file);
  };
  input.click();
}

function initActivation(){
  let dCode = DB.get('am_dc');
  if(!dCode){
    dCode = Math.floor(1000 + Math.random() * 9000);
    DB.set('am_dc', dCode);
  }

  const activated = DB.get('am_ak');
  if(activated && _vk(dCode, activated)){
    render();
    return;
  }

  const trialStart = DB.get('am_ts');
  const trialActivated = DB.get('am_ta');
  if(trialStart && trialActivated && _vt(dCode, trialActivated)){
    const daysPassed = (Date.now() - trialStart) / (1000*60*60*24);
    if(daysPassed < 7){
      render();
      _showTrialBanner(7 - Math.floor(daysPassed));
      return;
    }
    _showLockScreen(dCode, true);
    return;
  }

  _showLockScreen(dCode, false);
}

  if(document.getElementById('trialBanner')) return;

  banner.id = 'trialBanner';

// معادلة التحقق من كود التفعيل الدائم
function _vk(c,k){
  const _a='\x31\x37',_c='\x35\x32\x33',_d='\x31\x31\x33';
  const _x=c,_y=Number(_a),_z=Number(_c),_w=Number(_d);
  const _p=(_x*_y+_z)*3-_w;
  return Number(k)===_p;
}
// معادلة التحقق من كود التجربة (مختلفة عن الدائم)
function _vt(c,k){
  const _p=(c*9+257)*2-71;
  return Number(k)===_p;
}
// معادلة التحقق من كود الأسبوع الإضافي (منفصلة تمامًا عن الدائم والتجربة)
function _ve(c,k){
  const _p=(c*5+197)*2-59;
  return Number(k)===_p;
}
